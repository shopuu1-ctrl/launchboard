<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中国輸入 利益計算ツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --primary: #1a6fc4;
      --primary-light: #e8f0fb;
      --ok: #16a34a;
      --ok-bg: #dcfce7;
      --ng: #dc2626;
      --ng-bg: #fee2e2;
      --border: #e2e6ea;
      --label: #4b5563;
      --value: #111827;
      --muted: #6b7280;
      --shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", sans-serif;
      background: var(--bg);
      color: var(--value);
      min-height: 100vh;
      padding: 16px;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 18px;
      color: var(--primary);
      letter-spacing: .02em;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 18px 16px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: .78rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary-light);
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field-grid.single { grid-template-columns: 1fr; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: .75rem;
      color: var(--label);
      font-weight: 600;
    }

    .field input,
    .field select {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: .95rem;
      color: var(--value);
      background: #fff;
      width: 100%;
      transition: border-color .15s;
      -webkit-appearance: none;
    }

    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,111,196,.12);
    }

    .field .unit {
      font-size: .7rem;
      color: var(--muted);
    }

    .shipping-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .shipping-row .field:first-child { flex: 0 0 auto; min-width: 120px; }
    .shipping-row .field:last-child { flex: 1; }

    /* ---- Calc button ---- */
    .calc-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .04em;
      transition: background .15s, transform .1s;
      margin-bottom: 14px;
    }

    .calc-btn:active { background: #155ba0; transform: scale(.98); }

    /* ---- Result card ---- */
    #result { display: none; }

    .verdict {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
      border-radius: 10px;
      padding: 14px 0;
      margin-bottom: 16px;
      letter-spacing: .04em;
    }

    .verdict.ok  { background: var(--ok-bg);  color: var(--ok); }
    .verdict.ng  { background: var(--ng-bg);  color: var(--ng); }

    .breakdown {
      list-style: none;
      border-top: 1px solid var(--border);
    }

    .breakdown li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: .88rem;
      gap: 8px;
    }

    .breakdown li .label { color: var(--label); }
    .breakdown li .val   { font-weight: 600; white-space: nowrap; }
    .breakdown li .val.minus { color: var(--ng); }
    .breakdown li.total {
      font-size: 1rem;
      font-weight: 700;
      padding: 12px 0 4px;
      border-bottom: none;
    }
    .breakdown li.cost-total .val { color: var(--ng); }
    .breakdown li.profit-row .val { color: var(--ok); }
    .breakdown li.profit-row.loss .val { color: var(--ng); }

    .margin-bar-wrap {
      margin: 14px 0 0;
    }

    .margin-bar-label {
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .margin-bar {
      height: 10px;
      border-radius: 99px;
      background: var(--border);
      overflow: hidden;
    }

    .margin-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width .4s ease;
      background: var(--primary);
    }

    .margin-bar-fill.ok { background: var(--ok); }
    .margin-bar-fill.ng { background: var(--ng); }

    .threshold-line {
      position: relative;
      height: 14px;
      margin-top: 2px;
    }

    .threshold-line::before {
      content: "30%";
      position: absolute;
      left: 30%;
      transform: translateX(-50%);
      font-size: .65rem;
      color: var(--muted);
      top: 0;
    }

    .threshold-line::after {
      content: "";
      position: absolute;
      left: 30%;
      transform: translateX(-50%);
      top: -14px;
      width: 1.5px;
      height: 10px;
      background: var(--muted);
    }

    .reset-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: .85rem;
      cursor: pointer;
      margin-top: 4px;
    }

    .reset-btn:active { opacity: .7; }

    @media (max-width: 360px) {
      .field-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<h1>🇨🇳 中国輸入 利益計算ツール</h1>

<!-- 仕入れ情報 -->
<div class="card">
  <div class="card-title">仕入れ情報</div>
  <div class="field-grid">
    <div class="field">
      <label>商品代金</label>
      <input type="number" id="productPrice" placeholder="0" min="0" step="0.01">
      <span class="unit">元（CNY）</span>
    </div>
    <div class="field">
      <label>商品重量</label>
      <input type="number" id="weight" placeholder="0" min="0" step="1">
      <span class="unit">g（グラム）</span>
    </div>
    <div class="field">
      <label>為替レート</label>
      <input type="number" id="exchangeRate" placeholder="21" min="0" step="0.01" value="21">
      <span class="unit">円 / 元</span>
    </div>
    <div class="field">
      <label>代行手数料率</label>
      <input type="number" id="agencyRate" placeholder="5" min="0" max="100" step="0.1" value="5">
      <span class="unit">%</span>
    </div>
    <div class="field">
      <label>関税率</label>
      <input type="number" id="dutyRate" placeholder="8" min="0" max="100" step="0.1" value="8">
      <span class="unit">%</span>
    </div>
  </div>
</div>

<!-- 国際送料 -->
<div class="card">
  <div class="card-title">国際送料</div>
  <div class="shipping-row">
    <div class="field">
      <label>業者選択</label>
      <select id="carrier" onchange="onCarrierChange()">
        <option value="ocs">OCS</option>
        <option value="kaigen">海源通関</option>
        <option value="tw">TW物流</option>
        <option value="manual">手動入力</option>
      </select>
    </div>
    <div class="field">
      <label>送料単価</label>
      <input type="number" id="shippingRate" placeholder="200" min="0" step="1" value="200">
      <span class="unit">元 / kg</span>
    </div>
  </div>
</div>

<!-- Amazon情報 -->
<div class="card">
  <div class="card-title">Amazon・販売情報</div>
  <div class="field-grid">
    <div class="field">
      <label>販売価格</label>
      <input type="number" id="sellingPrice" placeholder="0" min="0" step="1">
      <span class="unit">円（JPY）</span>
    </div>
    <div class="field">
      <label>Amazon手数料</label>
      <input type="number" id="amazonFee" placeholder="0" min="0" step="1">
      <span class="unit">円</span>
    </div>
    <div class="field field-grid-span">
      <label>FBA出荷手数料</label>
      <input type="number" id="fbaFee" placeholder="0" min="0" step="1">
      <span class="unit">円</span>
    </div>
  </div>
</div>

<button class="calc-btn" onclick="calculate()">計算する</button>

<!-- 結果 -->
<div class="card" id="result">
  <div id="verdict" class="verdict"></div>

  <ul class="breakdown">
    <li>
      <span class="label">商品代金（円換算）</span>
      <span class="val" id="r-productJpy">—</span>
    </li>
    <li>
      <span class="label">国際送料</span>
      <span class="val minus" id="r-shipping">—</span>
    </li>
    <li>
      <span class="label">代行手数料</span>
      <span class="val minus" id="r-agency">—</span>
    </li>
    <li>
      <span class="label">関税</span>
      <span class="val minus" id="r-duty">—</span>
    </li>
    <li>
      <span class="label">消費税（輸入時）</span>
      <span class="val minus" id="r-tax">—</span>
    </li>
    <li class="total cost-total">
      <span class="label">仕入れ原価</span>
      <span class="val" id="r-cost">—</span>
    </li>
    <li>
      <span class="label">Amazon手数料</span>
      <span class="val minus" id="r-amazon">—</span>
    </li>
    <li>
      <span class="label">FBA出荷手数料</span>
      <span class="val minus" id="r-fba">—</span>
    </li>
    <li class="total profit-row" id="r-profit-row">
      <span class="label">粗利</span>
      <span class="val" id="r-profit">—</span>
    </li>
  </ul>

  <div class="margin-bar-wrap">
    <div class="margin-bar-label">
      <span>粗利率</span>
      <span id="r-margin-pct">—</span>
    </div>
    <div class="margin-bar">
      <div class="margin-bar-fill" id="margin-fill" style="width:0%"></div>
    </div>
    <div class="threshold-line"></div>
  </div>
</div>

<button class="reset-btn" id="reset-btn" onclick="resetForm()" style="display:none">リセット</button>

<script>
  const CARRIER_RATES = {
    ocs:    200,
    kaigen: 160,
    tw:     180,
    manual: null,
  };

  function onCarrierChange() {
    const carrier = document.getElementById('carrier').value;
    const rateInput = document.getElementById('shippingRate');
    const rate = CARRIER_RATES[carrier];
    if (rate !== null) {
      rateInput.value = rate;
      rateInput.readOnly = false;
    } else {
      rateInput.value = '';
      rateInput.readOnly = false;
      rateInput.focus();
    }
  }

  function fmt(n) {
    return '¥' + Math.round(n).toLocaleString('ja-JP');
  }

  function calculate() {
    const productCny  = parseFloat(document.getElementById('productPrice').value) || 0;
    const weightG     = parseFloat(document.getElementById('weight').value)        || 0;
    const rate        = parseFloat(document.getElementById('exchangeRate').value)  || 21;
    const agencyRate  = parseFloat(document.getElementById('agencyRate').value)    || 5;
    const dutyRate    = parseFloat(document.getElementById('dutyRate').value)      || 8;
    const shippingPer = parseFloat(document.getElementById('shippingRate').value)  || 0;
    const sellingJpy  = parseFloat(document.getElementById('sellingPrice').value)  || 0;
    const amazonFee   = parseFloat(document.getElementById('amazonFee').value)     || 0;
    const fbaFee      = parseFloat(document.getElementById('fbaFee').value)        || 0;

    // 商品代金（円換算）
    const productJpy = productCny * rate;

    // 国際送料（円）= 重量(g) ÷ 1000 × 単価(元/kg) × レート
    const shipping = (weightG / 1000) * shippingPer * rate;

    // 代行手数料（円）= 商品代金(円換算) × 代行手数料率
    const agency = productJpy * (agencyRate / 100);

    // 関税（円）= 商品代金(円換算) × 関税率
    const duty = productJpy * (dutyRate / 100);

    // 消費税（円）= (商品代金(円換算) + 関税) × 10%
    const tax = (productJpy + duty) * 0.1;

    // 仕入れ原価
    const cost = productJpy + shipping + agency + duty + tax;

    // 粗利
    const profit = sellingJpy - cost - amazonFee - fbaFee;

    // 粗利率
    const margin = sellingJpy > 0 ? (profit / sellingJpy) * 100 : 0;
    const isOk   = margin >= 30;

    // 表示
    document.getElementById('r-productJpy').textContent = fmt(productJpy);
    document.getElementById('r-shipping').textContent   = '−' + fmt(shipping);
    document.getElementById('r-agency').textContent     = '−' + fmt(agency);
    document.getElementById('r-duty').textContent       = '−' + fmt(duty);
    document.getElementById('r-tax').textContent        = '−' + fmt(tax);
    document.getElementById('r-cost').textContent       = fmt(cost);
    document.getElementById('r-amazon').textContent     = '−' + fmt(amazonFee);
    document.getElementById('r-fba').textContent        = '−' + fmt(fbaFee);
    document.getElementById('r-profit').textContent     = fmt(profit);

    const marginText = margin.toFixed(1) + '%';
    document.getElementById('r-margin-pct').textContent = marginText;

    // バー
    const fill = document.getElementById('margin-fill');
    const clampedPct = Math.min(Math.max(margin, 0), 100);
    fill.style.width = clampedPct + '%';
    fill.className   = 'margin-bar-fill ' + (isOk ? 'ok' : 'ng');

    // 粗利行の色
    const profitRow = document.getElementById('r-profit-row');
    profitRow.className = 'total profit-row' + (profit < 0 ? ' loss' : '');

    // 判定
    const verdict = document.getElementById('verdict');
    verdict.textContent = isOk
      ? `✅ 仕入れOK（粗利率 ${marginText}）`
      : `❌ 見送り（粗利率 ${marginText}）`;
    verdict.className = 'verdict ' + (isOk ? 'ok' : 'ng');

    document.getElementById('result').style.display   = 'block';
    document.getElementById('reset-btn').style.display = 'block';
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function resetForm() {
    ['productPrice','weight','sellingPrice','amazonFee','fbaFee'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('exchangeRate').value = '21';
    document.getElementById('agencyRate').value   = '5';
    document.getElementById('dutyRate').value     = '8';
    document.getElementById('carrier').value      = 'ocs';
    document.getElementById('shippingRate').value = '200';

    document.getElementById('result').style.display    = 'none';
    document.getElementById('reset-btn').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Enterキーで計算
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') calculate();
  });
</script>
</body>
</html>
